name: Record Trans7

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Recording duration in seconds"
        required: false
        default: "300"
      type:
        description: "Stream type (trans7/transtv/cnn)"
        required: false
        default: "trans7"
      chat_id:
        description: "Telegram chat ID"
        required: false
        default: ""
  repository_dispatch:
    types: [record-trans7, record-request]

env:
  STREAM_TYPE: ${{ github.event.inputs.type || github.event.client_payload.stream_type || 'trans7' }}
  DURATION: ${{ github.event.inputs.duration || github.event.client_payload.duration || '300' }}
  CHAT_ID: ${{ github.event.inputs.chat_id || github.event.client_payload.chat_id || '' }}

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 198
    env:
      TZ: Asia/Jakarta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Step 1: Generate fresh token — pure Python, no browser
      - name: Generate Wowza token
        id: token
        run: |
          TOKEN_URL=$(python scripts/gen_trans7_token.py 2>&1 | grep '^TOKEN_URL=' | cut -d= -f2-)
          if [ -z "$TOKEN_URL" ]; then
            echo "::error::Token generator returned empty URL"
            exit 1
          fi
          echo "url=$TOKEN_URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Token URL: ${TOKEN_URL:0:100}"

      # Step 2: Verify playlist reachable
      - name: Verify playlist
        id: verify
        run: |
          URL="${{ steps.token.outputs.url }}"
          echo "Testing: ${URL:0:80}..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Referer: https://20.detik.com/" \
            -H "Origin: https://20.detik.com" \
            "$URL")
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "::notice::Playlist HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Playlist returned $HTTP_CODE"
            exit 1
          fi

      # Step 3: Parse chunklist (with retry for CDN block)
      - name: Get chunklist URL
        id: chunklist
        if: steps.verify.outputs.http_code == '200'
        run: |
          URL="${{ steps.token.outputs.url }}"
          CHUNK=""
          MAX_TRIES=3
          for attempt in 1 2 3; do
            BODY_FILE=$(mktemp)
            HTTP_CODE=$(curl -s -o "$BODY_FILE" -w "%{http_code}" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
              -H "Referer: https://20.detik.com/" \
              -H "Origin: https://20.detik.com" \
              "$URL")
            echo "   attempt $attempt: HTTP $HTTP_CODE, size=$(wc -c < "$BODY_FILE" | tr -d ' ')"

            if grep -q '#EXTM3U' "$BODY_FILE"; then
              # Prefer 720p (b744100 / 1280x720), else first media URI
              cat "$BODY_FILE"
              CHUNK=$(awk '
                /RESOLUTION=1280x720/ { want=1; next }
                want && $0 !~ /^#/ && NF { print; exit }
              ' "$BODY_FILE")
              [ -z "$CHUNK" ] && CHUNK=$(grep -v '^#' "$BODY_FILE" | grep -v '^$' | head -1)
              rm -f "$BODY_FILE"
              break
            fi

            # Not HLS — CDN returned error page. Regenerate token + retry
            echo "   ::warning::attempt $attempt: body not HLS ($(head -c 120 "$BODY_FILE" || true))"
            rm -f "$BODY_FILE"

            if [ "$attempt" -lt "$MAX_TRIES" ]; then
              echo "   ::notice::Regenerating token (30s cooldown)..."
              sleep 30
              TOKEN_URL=$(python scripts/gen_trans7_token.py 2>&1 | grep '^TOKEN_URL=' | cut -d= -f2-)
              if [ -z "$TOKEN_URL" ]; then
                echo "   ::error::Token regeneration failed at attempt $attempt"
                exit 1
              fi
              URL="$TOKEN_URL"
            fi
          done

          if [ -z "$CHUNK" ]; then
            echo "::error::No chunklist found after $MAX_TRIES attempts"
            exit 1
          fi
          case "$CHUNK" in
            http*) ;;
            *)
              BASE=$(echo "$URL" | sed 's|/[^/]*$||')
              CHUNK="${BASE}/${CHUNK}"
              ;;
          esac
          case "$CHUNK" in
            *'<html'*|*'<HTML'*|*Forbidden*)
              echo "::error::Parsed chunklist looks like HTML error page: ${CHUNK:0:120}"
              exit 1
              ;;
          esac
          echo "chunk_url=$CHUNK" >> "$GITHUB_OUTPUT"
          echo "::notice::Chunklist: ${CHUNK:0:120}"

      # Step 4: Record with ffmpeg + live Telegram progress
      - name: Record stream
        id: record
        if: steps.chunklist.outputs.chunk_url != ''
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ env.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          DURATION: ${{ env.DURATION }}
          M3U8_URL: ${{ steps.chunklist.outputs.chunk_url }}
          CHUNK_URL: ${{ steps.token.outputs.url }}
        run: python3 scripts/rec_progress.py

      # Step 5: Extract metadata + thumbnail
      - name: Extract metadata
        id: meta
        if: steps.record.outputs.recorded == 'true'
        run: |
          FILE="${{ steps.record.outputs.output }}"
          THUMB="${FILE%.mp4}.jpg"

          DUR_RAW=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null | head -1)
          DUR_INT=${DUR_RAW%.*}
          [ -z "$DUR_INT" ] && DUR_INT=0
          REAL_DURATION=$(printf '%02d:%02d:%02d' $((DUR_INT/3600)) $(((DUR_INT%3600)/60)) $((DUR_INT%60)))

          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width \
            -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null | head -1)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height \
            -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null | head -1)
          [ -n "$WIDTH" ] && [ -n "$HEIGHT" ] && RESOLUTION="${WIDTH}x${HEIGHT}" || RESOLUTION="?"

          VCODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null | head -1)
          [ -z "$VCODEC" ] && VCODEC="?"

          BR_RAW=$(ffprobe -v error -show_entries format=bit_rate \
            -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null | head -1)
          case "$BR_RAW" in ''|*[!0-9]*) VBITRATE="?" ;; *) VBITRATE="$(awk "BEGIN{printf \"%.1f Mbps\", ${BR_RAW}/1000000}")" ;; esac

          echo "📊 Metadata: dur=$REAL_DURATION res=$RESOLUTION codec=$VCODEC br=$VBITRATE size=${{ env.FILE_SIZE }}"

          # Thumbnail
          SEEK=1; [ "$DUR_INT" -gt 6 ] && SEEK=$((DUR_INT / 2))
          HAS_THUMB=0
          ffmpeg -hide_banner -loglevel error -y -ss "$SEEK" -i "$FILE" \
            -frames:v 1 -q:v 2 -vf "scale=640:-2" "$THUMB" 2>/dev/null || true
          [ ! -s "$THUMB" ] && ffmpeg -hide_banner -loglevel error -y -ss 1 -i "$FILE" \
            -frames:v 1 -q:v 2 -vf "scale=640:-2" "$THUMB" 2>/dev/null || true
          [ -s "$THUMB" ] && HAS_THUMB=1 && echo "✅ Thumbnail: $THUMB" || rm -f "$THUMB"

          {
            echo "REAL_DURATION=$REAL_DURATION"
            echo "RESOLUTION=$RESOLUTION"
            echo "VCODEC=$VCODEC"
            echo "VBITRATE=$VBITRATE"
            echo "THUMB_FILE=$THUMB"
            echo "HAS_THUMB=$HAS_THUMB"
          # SHA256 hash for integrity verification
          ORIG_SHA256=$(sha256sum "$FILE" | cut -d" " -f1)
          echo "ORIG_SHA256=$ORIG_SHA256"
          } >> $GITHUB_ENV

      # Step 6: Start local Bot API Server (allow >50MB uploads)
      - name: Start local Bot API Server
        if: success() && steps.record.outputs.recorded == 'true'
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set +e
          docker rm -f tg-bot-api >/dev/null 2>&1 || true
          rm -rf /tmp/tg-bot-api && mkdir -p /tmp/tg-bot-api
          docker run -d --name tg-bot-api -p 8081:8081 \
            -e TELEGRAM_API_ID="$TELEGRAM_API_ID" \
            -e TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
            -e TELEGRAM_LOCAL=1 \
            -v /tmp/tg-bot-api:/var/lib/telegram-bot-api \
            aiogram/telegram-bot-api:latest \
            --local -m 2097152000 --dir /var/lib/telegram-bot-api --http-port 8081 --verbosity=2
          echo "⏳ Menunggu Bot API Server siap..."
          for i in $(seq 1 45); do
            CODE=$(curl -s -o /tmp/getme.json -w "%{http_code}" "http://localhost:8081/bot${BOT_TOKEN}/getMe" 2>/dev/null)
            if [ "$CODE" = "200" ]; then echo "✅ Bot API Server ready"; break; fi
            sleep 2
          done

      # Step 7: Send video to Telegram
      - name: Notify Telegram — send video
        if: always() && steps.record.outputs.recorded == 'true'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ env.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          FILENAME: ${{ steps.record.outputs.output }}
          JOB_STATUS: success
          REAL_DURATION: ${{ env.REAL_DURATION }}
          RESOLUTION: ${{ env.RESOLUTION }}
          VCODEC: ${{ env.VCODEC }}
          VBITRATE: ${{ env.VBITRATE }}
          FILE_SIZE: ${{ env.FILE_SIZE }}
          ORIG_BYTES: ${{ env.ORIG_BYTES }}
          THUMB_FILE: ${{ env.THUMB_FILE }}
          HAS_THUMB: ${{ env.HAS_THUMB }}
          TG_API_URL: "http://localhost:8081"
          PHASE: original
        run: python3 scripts/notify.py

      # Step 8: Upload artifact (backup)
      - name: Upload recording
        if: steps.record.outputs.recorded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trans7-recording-${{ github.run_number }}
          path: Wosufemi-Asset-*.mp4
          retention-days: 3

      # Step 8b: Release + .txt (metadata + m3u8 + .ts URLs)
      - name: Create release with .txt
        if: steps.record.outputs.recorded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="${{ steps.record.outputs.output }}"
          TAG="trans7-$(date +%s)"
          DUR="${{ env.DURATION }}"
          DH=""; DM=""
          [ $((DUR/3600)) -gt 0 ] && DH="$((DUR/3600))h"
          [ $(((DUR%3600)/60)) -gt 0 ] && DM="$(((DUR%3600)/60))m"
          DL="${DH}${DM}"; [ -z "$DL" ] && DL="${DUR}s"
          TITLE="Trans7 — $(date '+%Y-%m-%d %H:%M:%S') WIB (${DL})"
          TOKEN_URL="${{ steps.token.outputs.url }}"
          CHUNK_URL="${{ steps.chunklist.outputs.chunk_url }}"

          # Fetch chunklist → ambil semua .ts URLs
          TS_LIST_FILE=$(mktemp)
          if [ -n "$CHUNK_URL" ]; then
            CHUNK_BODY=$(curl -s \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -H "Referer: https://20.detik.com/" \
              "$CHUNK_URL")
            BASE=$(echo "$CHUNK_URL" | sed 's|/[^/]*$||')
            echo "$CHUNK_BODY" | grep -E '\.ts' | while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in \#*) continue ;; esac
              case "$line" in
                http*) echo "$line" ;;
                *) echo "${BASE}/${line}" ;;
              esac
            done > "$TS_LIST_FILE"
          fi
          TS_COUNT=$(wc -l < "$TS_LIST_FILE" | tr -d ' ')

          # Buat .txt
          TXT="${FILE%.mp4}.txt"
          {
            echo "# trans7 — record update"
            echo "file: ${FILE}"
            echo "size: ${{ env.FILE_SIZE }}"
            echo "durasi: ${{ env.REAL_DURATION }}"
            echo "resolusi: ${{ env.RESOLUTION }}"
            echo "codec: ${{ env.VCODEC }}"
            echo "bitrate: ${{ env.VBITRATE }}"
            echo "sha256_orig: ${{ env.ORIG_SHA256 }}"
            echo "sha256_hevc: ${{ env.HEVC_SHA256 }}"
            echo "master_url: ${TOKEN_URL}"
            echo "chunklist_url: ${CHUNK_URL}"
            echo "ts_count: ${TS_COUNT}"
            echo "recorded_at: $(date '+%Y-%m-%dT%H:%M:%S %z')"
            echo ""
            echo "# all .ts segment URLs (snapshot at record time)"
            if [ -s "$TS_LIST_FILE" ]; then
              cat "$TS_LIST_FILE"
            else
              echo "# (no .ts resolved)"
            fi
          } > "$TXT"
          rm -f "$TS_LIST_FILE"

          NOTES="Trans7 auto-record. Token generated in GHA (pure Python). Video sent to Telegram."
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "$TITLE" --notes "$NOTES" \
            "$TXT" || echo "⚠️ Release gagal"
          echo "✅ Release $TAG: $(ls -lh "$TXT" | awk '{print $5}')"


      - name: Encode to HEVC 10-bit
        id: hevc
        if: always() && steps.record.outputs.recorded == 'true'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ env.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          FILENAME: ${{ steps.record.outputs.output }}
          DURATION_SEC: ${{ env.DURATION }}
          TG_API_URL: "http://localhost:8081"
        run: |
          FILE="${{ steps.record.outputs.output }}"
          HEVC_FILE="${FILE%.mp4}-h265-10bit.mp4"
          SRC_DUR_INT="${DURATION_SEC:-60}"
          [ "$SRC_DUR_INT" -le 0 ] && SRC_DUR_INT=60

          echo "🎞 Encoding HEVC 10-bit (main10, yuv420p10le, CRF 28)..."
          echo "🎚 Audio mastering: loudnorm 2-pass + speechnorm + compressor + limiter..."

          # ── PASS 1: Analyze loudness ──
          echo "📊 Analyzing audio loudness (pass 1)..."
          LOUD_JSON=$(ffmpeg -hide_banner -i "$FILE" \
            -af "loudnorm=I=-14:TP=-1.0:LRA=9:print_format=json" \
            -f null - 2>&1 | tail -20 | grep -A 12 '{')
          IN_I=$(echo "$LOUD_JSON" | grep 'input_i' | sed 's/.*: *"//' | sed 's/".*//')
          IN_TP=$(echo "$LOUD_JSON" | grep 'input_tp' | sed 's/.*: *"//' | sed 's/".*//')
          IN_LRA=$(echo "$LOUD_JSON" | grep 'input_lra' | sed 's/.*: *"//' | sed 's/".*//')
          IN_THRESH=$(echo "$LOUD_JSON" | grep 'input_thresh' | sed 's/.*: *"//' | sed 's/".*//')
          echo "   Input: ${IN_I} LUFS, TP ${IN_TP} dB, LRA ${IN_LRA} LU"

          # ── LRA targeting: auto-pick target LRA from source ──
          # Low LRA (speech/news) → cinematic tight control (LRA 5)
          # High LRA (music/ads) → documentary natural (LRA 11)
          LRA_INT=${IN_LRA%.*}
          [ -z "$LRA_INT" ] && LRA_INT=8
          if [ "$LRA_INT" -le 8 ]; then
            TGT_LRA=5
            TGT_MODE="cinematic"
          else
            TGT_LRA=11
            TGT_MODE="documentary"
          fi
          echo "   Mode: ${TGT_MODE} (target LRA ${TGT_LRA} LU)"

          # ── #6 Loudness-weighted compression ──
          # Compressor threshold adapts to source loudness:
          #   Source already at target (-14 LUFS) → less compress (preserve dynamics)
          #   Source quiet (-20 LUFS) → more compress (bring up to target)
          IN_I_INT=${IN_I%.*}
          [ -z "$IN_I_INT" ] && IN_I_INT=-20
          # Threshold = -18dB base, adjust ±6dB based on distance from target
          # Delta = |IN_I - (-14)|, threshold = -18 + (delta * 0.6), clamped -24 to -12
          DELTA=$(( IN_I_INT + 14 ))
          [ "$DELTA" -lt 0 ] && DELTA=$(( -DELTA ))
          THRESH=$(( -18 + (DELTA * 60) / 100 ))
          [ "$THRESH" -gt -12 ] && THRESH=-12
          [ "$THRESH" -lt -24 ] && THRESH=-24
          # Ratio: more delta → higher ratio (2.0 to 3.5)
          RATIO_NUM=$(( 20 + DELTA * 15 / 10 ))
          [ "$RATIO_NUM" -gt 35 ] && RATIO_NUM=35
          [ "$RATIO_NUM" -lt 20 ] && RATIO_NUM=20
          RATIO=$(awk "BEGIN{printf \"%.1f\", ${RATIO_NUM}/10}")
          echo "   Loudness-weighted: delta=${DELTA} LU → threshold=${THRESH}dB ratio=${RATIO}:1"

          # ── #2 Loudness-based bitrate allocation ──
          # Source at -14 LUFS → 128k (less data needed, already clean)
          # Source at -20 LUFS → 256k (preserve low-level detail)
          # Clamped 96k–320k
          TGT_LU=-14
          ABR=192  # default fallback
          if [ -n "$IN_I_INT" ]; then
            BITSTEP=$(awk "BEGIN{d=$IN_I_INT - $TGT_LU; if(d<0)d=-d; printf \"%.0f\", d * 12}")
            ABR=$(( 160 - BITSTEP ))
            [ "$ABR" -lt 96 ] && ABR=96
            [ "$ABR" -gt 320 ] && ABR=320
          fi
          echo "   Adaptive bitrate: ${ABR}k (source ${IN_I_INT:--20} LUFS → target ${TGT_LU})"

          # ── #1 True peak limiting ──
          # alimiter: limit=-1.0dB, auto level on. No oversampling option in ffmpeg 6.1.1
          LIMITER="alimiter=limit=-1.0dB:level=true"
          echo "   True peak: alimiter -1.0 dB"

          # ── #2 Per-channel loudnorm (dual_mono) ──
          # loudnorm with dual_mono=true balances L/R channels separately
          # Use when channel imbalance detected (|L_I - R_I| > 2 LU)
          DUAL_MONO="false"
          if [ -n "$IN_I" ] && [ "$IN_I" != "-inf" ]; then
            # Quick check for channel imbalance via ebur128 per-channel
            CH_BAL=$(ffmpeg -hide_banner -i "$FILE" -t 10 \
              -filter_complex "[0:a]ebur128=peak=none:framelog=verbose:metadata=1" \
              -f null - 2>&1 | grep -E "I:\s+.*LUFS" | head -2 | awk '{print $2}' || true)
            if [ -n "$CH_BAL" ] && [ "$(echo "$CH_BAL" | wc -l)" -eq 2 ]; then
              L_I=$(echo "$CH_BAL" | head -1)
              R_I=$(echo "$CH_BAL" | tail -1)
              DIFF=$(awk "BEGIN{d=$L_I-$R_I; if(d<0)d=-d; printf \"%.0f\", d}")
              if [ "$DIFF" -gt 2 ]; then
                DUAL_MONO="true"
                echo "   Channel imbalance: L=${L_I} R=${R_I} → dual_mono=true"
              fi
            fi
          fi

          # ── #4 Dynamic range expansion (de-compand) ──
          # If LRA < 4, source is over-compressed (broadcast) → gentle expansion
          # acompressor ratio min=1, can't go below. Use compand for expansion.
          if [ -n "$IN_LRA" ]; then
            LRA_CHECK=${IN_LRA%.*}
            if [ "$LRA_CHECK" -lt 4 ]; then
              echo "   De-compand: LRA ${IN_LRA} < 4 → dynamic range expansion"
              EXPAND="compand=attacks=0.01:decays=0.3:points=-80/-80|-30/-20|0/0"
            else
              EXPAND=""
            fi
          else
            EXPAND=""
          fi

          # ── #5 Harmonic saturation (analog warmth) ──
          # asubboost adds subharmonics, aexciter adds high harmonics
          # Even-order harmonics = "warmth", perceived loudness up without level change
          HARMONIC=""  # disabled — asubboost/aexciter not in Ubuntu 6.1.1
          echo "   Harmonic: disabled (ffmpeg 6.1.1 missing filters)"

          # ── Build AF_MASTER chain (core filters, no resampling) ──
          if [ -z "$IN_I" ] || [ "$IN_I" = "-inf" ]; then
            echo "   ⚠️ Loudness analysis failed, using single-pass preset"
            AF_MASTER_CHAIN="loudnorm=I=-14:TP=-1.0:LRA=${TGT_LRA}:dual_mono=${DUAL_MONO},speechnorm=e=50:r=0.0005:l=1,acompressor=threshold=-18dB:ratio=2.5:attack=20:release=250:makeup=1,${LIMITER}"
          else
            AF_MASTER_CHAIN="loudnorm=I=-14:TP=-1.0:LRA=${TGT_LRA}:measured_I=${IN_I}:measured_TP=${IN_TP}:measured_LRA=${IN_LRA}:measured_thresh=${IN_THRESH}:linear=true:dual_mono=${DUAL_MONO},speechnorm=e=50:r=0.0005:l=1"
            [ -n "$EXPAND" ] && AF_MASTER_CHAIN="${AF_MASTER_CHAIN},${EXPAND}"
            AF_MASTER_CHAIN="${AF_MASTER_CHAIN},acompressor=threshold=${THRESH}dB:ratio=${RATIO}:attack=20:release=250:makeup=1"
            [ -n "$HARMONIC" ] && AF_MASTER_CHAIN="${AF_MASTER_CHAIN},${HARMONIC}"
            AF_MASTER_CHAIN="${AF_MASTER_CHAIN},${LIMITER}"
          fi

          # ── #5 Loudness-weighted resampling (96k analysis → 48k output) ──
          # aresample at 96kHz for more accurate loudnorm analysis,
          # then aresample back to 48kHz for compact output
          AF_MASTER="aresample=96000:filter_size=256:phase_shift=0,${AF_MASTER_CHAIN},aresample=48000:filter_size=256:phase_shift=0"
          echo "   Resampling: 96k analysis → 48k output"

          echo "   Target: -14 LUFS / -1.0 dBTP / LRA ${TGT_LRA} LU (${TGT_MODE})"

          # ── #4 Loudness meter overlay ──
          # Disabled — ebur128=video=1 not stable in Ubuntu ffmpeg 6.1.1
          HAS_LU_OVERLAY=0
          echo "   Loudness overlay: disabled (ffmpeg 6.1.1 compat)"

          # ── #2 Binaural audio ──
          # Disabled — headphone/HRTF not stable in Ubuntu ffmpeg 6.1.1
          HAS_BINAURAL=0
          echo "   Binaural: disabled (ffmpeg 6.1.1 compat)"

          # Progress bar
          CHAT_ID="$CHAT_ID" FILENAME="$FILE" TG_API_URL="$TG_API_URL" \
            BOT_TOKEN="$BOT_TOKEN" PROGRESS_MSG_FILE=/tmp/trans7_hevc_progress \
            python3 scripts/progress.py start || true

          # Build filter_complex: binaural + loudness overlay
          if [ "$HAS_BINAURAL" -eq 1 ] && [ "$HAS_LU_OVERLAY" -eq 1 ]; then
            echo "🎬 Mode: binaural + loudness overlay"
            FILTER_COMPLEX="[0:v]scale=1280:720[bg];[1:v]scale=320:180[lu];[bg][lu]overlay=W-w-16:H-h-16[v];[2:a]${AF_MASTER}[a]"
            INPUTS=(-i "$FILE" -i "$LU_GRAPH" -i "$BINAURAL_FILE")
            MAP_OPTS=(-map "[v]" -map "[a]")
          elif [ "$HAS_BINAURAL" -eq 1 ]; then
            echo "🎬 Mode: binaural only"
            FILTER_COMPLEX="[1:a]${AF_MASTER}[a]"
            INPUTS=(-i "$FILE" -i "$BINAURAL_FILE")
            MAP_OPTS=(-map 0:v -map "[a]")
          elif [ "$HAS_LU_OVERLAY" -eq 1 ]; then
            echo "🎬 Mode: loudness overlay only"
            FILTER_COMPLEX="[0:v]scale=1280:720[bg];[1:v]scale=320:180[lu];[bg][lu]overlay=W-w-16:H-h-16[v]"
            INPUTS=(-i "$FILE" -i "$LU_GRAPH")
            MAP_OPTS=(-map "[v]" -map 0:a)
          else
            echo "🎬 Mode: standard (no binaural, no overlay)"
            FILTER_COMPLEX=""
            INPUTS=(-i "$FILE")
            MAP_OPTS=(-map 0:v -map 0:a)
          fi

          LAST_PCT=-1; NEXT_SEND=0
          if [ -n "$FILTER_COMPLEX" ]; then
            (
              ffmpeg -hide_banner -y "${INPUTS[@]}" \
                -filter_complex "$FILTER_COMPLEX" \
                "${MAP_OPTS[@]}" \
                -c:v libx265 -profile:v main10 -pix_fmt yuv420p10le \
                -crf 28 -preset fast -tag:v hvc1 \
                -c:a aac -b:a ${ABR}k -ar 48000 \
                -progress pipe:1 \
                "$HEVC_FILE" 2>/dev/null
            ) | while IFS='=' read -r k v; do
              if [ "$k" = "out_time_ms" ]; then
                ms=${v%.*}
                [ "$ms" -gt 0 ] 2>/dev/null || continue
                cur=$(( ms / 1000000 ))
                pct=$(( (cur * 100) / SRC_DUR_INT ))
                [ "$pct" -gt 100 ] && pct=100
                now=$(date +%s)
                if [ "$pct" -ge "$((LAST_PCT + 10))" ] && [ "$now" -ge "$NEXT_SEND" ]; then
                  LAST_PCT=$(( (pct / 10) * 10 ))
                  NEXT_SEND=$(( now + 5 ))
                  echo "🔄 HEVC encode ${LAST_PCT}%"
                  CHAT_ID="$CHAT_ID" FILENAME="$FILE" TG_API_URL="$TG_API_URL" \
                    BOT_TOKEN="$BOT_TOKEN" PROGRESS_MSG_FILE=/tmp/trans7_hevc_progress \
                    python3 scripts/progress.py progress "$LAST_PCT" || true
                fi
              fi
            done
          else
            (
              ffmpeg -hide_banner -y -i "$FILE" \
                -c:v libx265 -profile:v main10 -pix_fmt yuv420p10le \
                -crf 28 -preset fast -tag:v hvc1 \
                -af "$AF_MASTER" \
                -c:a aac -b:a ${ABR}k -ar 48000 \
                -progress pipe:1 \
                "$HEVC_FILE" 2>/dev/null
            ) | while IFS='=' read -r k v; do
              if [ "$k" = "out_time_ms" ]; then
                ms=${v%.*}
                [ "$ms" -gt 0 ] 2>/dev/null || continue
                cur=$(( ms / 1000000 ))
                pct=$(( (cur * 100) / SRC_DUR_INT ))
                [ "$pct" -gt 100 ] && pct=100
                now=$(date +%s)
                if [ "$pct" -ge "$((LAST_PCT + 10))" ] && [ "$now" -ge "$NEXT_SEND" ]; then
                  LAST_PCT=$(( (pct / 10) * 10 ))
                  NEXT_SEND=$(( now + 5 ))
                  echo "🔄 HEVC encode ${LAST_PCT}%"
                  CHAT_ID="$CHAT_ID" FILENAME="$FILE" TG_API_URL="$TG_API_URL" \
                    BOT_TOKEN="$BOT_TOKEN" PROGRESS_MSG_FILE=/tmp/trans7_hevc_progress \
                    python3 scripts/progress.py progress "$LAST_PCT" || true
                fi
              fi
            done
          fi

          CHAT_ID="$CHAT_ID" FILENAME="$FILE" TG_API_URL="$TG_API_URL" \
            BOT_TOKEN="$BOT_TOKEN" PROGRESS_MSG_FILE=/tmp/trans7_hevc_progress \
            python3 scripts/progress.py done || true

          if [ -s "$HEVC_FILE" ]; then
            HEVC_SIZE=$(ls -lh "$HEVC_FILE" | awk '{print $5}')
            echo "✅ HEVC 10-bit: $HEVC_SIZE"

            # ── #6 Loudness history graph (time-series per 10s) ──
            echo "📈 Generating loudness history..."
            LU_HISTORY="/tmp/lu_history.txt"
            MAX_SEG=30
            SEG_DUR=$(( (SRC_DUR_INT + MAX_SEG - 1) / MAX_SEG ))
            [ "$SEG_DUR" -lt 5 ] && SEG_DUR=5
            SEGMENTS=$(( SRC_DUR_INT / SEG_DUR ))
            [ "$SEGMENTS" -lt 1 ] && SEGMENTS=1
            > "$LU_HISTORY"
            for i in $(seq 0 $((SEGMENTS - 1))); do
              SEG_START=$(( i * SEG_DUR ))
              SEG_LU=$(ffmpeg -hide_banner -ss "$SEG_START" -t "$SEG_DUR" -i "$HEVC_FILE" \
                -af "loudnorm=I=-14:TP=-1.0:LRA=9:print_format=summary" \
                -f null - 2>&1 | grep "Input Integrated" | awk '{print $NF}' || true)
              [ -n "$SEG_LU" ] && echo "${SEG_START}s: ${SEG_LU} LUFS" >> "$LU_HISTORY"
            done
            [ -s "$LU_HISTORY" ] && echo "   History: $(wc -l < "$LU_HISTORY") segments (every ${SEG_DUR}s)" || echo "   ⚠️ History gagal"

            # ── #3 Loudness metadata embedding ──
            echo "🏷 Embedding loudness metadata..."
            FINAL_FILE="${HEVC_FILE%.mp4}-mastered.mp4"
            mv "$HEVC_FILE" "$FINAL_FILE"
            HEVC_FILE="$FINAL_FILE"
            # Post-encode loudness verification
            POST_LOUD=$(ffmpeg -hide_banner -i "$HEVC_FILE" \
              -af "loudnorm=I=-14:TP=-1.0:LRA=9:print_format=summary" \
              -f null - 2>&1 | grep -E 'Input Integrated|Input True Peak|Input LRA' | awk '{print $(NF-1)}')
            POST_I=$(echo "$POST_LOUD" | sed -n '1p')
            POST_TP=$(echo "$POST_LOUD" | sed -n '2p')
            POST_LRA=$(echo "$POST_LOUD" | sed -n '3p')
            [ -z "$POST_I" ] && POST_I="?"
            [ -z "$POST_TP" ] && POST_TP="?"
            [ -z "$POST_LRA" ] && POST_LRA="?"
            echo "   Mastered: ${POST_I} LUFS, TP ${POST_TP} dB, LRA ${POST_LRA} LU"
            # Write metadata to MP4
            ffmpeg -hide_banner -y -i "$HEVC_FILE" -c copy \
              -metadata loudness_I="${POST_I}" \
              -metadata loudness_TP="${POST_TP}" \
              -metadata loudness_LRA="${POST_LRA}" \
              -metadata loudness_target="-14 LUFS / -1.0 dBTP / LRA ${TGT_LRA} LU" \
              -metadata loudness_mode="${TGT_MODE}" \
              -metadata loudness_weighted="delta=${DELTA} threshold=${THRESH}dB ratio=${RATIO}:1" \
              "${HEVC_FILE%.mp4}-meta.mp4" 2>/dev/null && mv "${HEVC_FILE%.mp4}-meta.mp4" "$HEVC_FILE" || true
            echo "HEVC_FILE=$HEVC_FILE" >> $GITHUB_ENV
            echo "HEVC_SIZE=$HEVC_SIZE" >> $GITHUB_ENV
            echo "HEVC_LOUDNESS_I=$POST_I" >> $GITHUB_ENV
            echo "HEVC_LOUDNESS_TP=$POST_TP" >> $GITHUB_ENV
            echo "HEVC_LOUDNESS_LRA=$POST_LRA" >> $GITHUB_ENV
            # Audio metadata for quality report
            HEVC_ACODEC=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            HEVC_ABR=$(ffprobe -v error -select_streams a:0 -show_entries stream=bit_rate -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            HEVC_ASR=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            HEVC_ACH=$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            echo "HEVC_ACODEC=$HEVC_ACODEC" >> $GITHUB_ENV
            echo "HEVC_ABR=$HEVC_ABR" >> $GITHUB_ENV
            echo "HEVC_ASR=$HEVC_ASR" >> $GITHUB_ENV
            echo "HEVC_ACH=$HEVC_ACH" >> $GITHUB_ENV
            # Compression ratio
            ORIG_BYTES_INT=${{ env.ORIG_BYTES }}
            HEVC_BYTES=$(stat -c%s "$HEVC_FILE" 2>/dev/null || echo 0)
            if [ "$HEVC_BYTES" -gt 0 ] 2>/dev/null; then
              COMP_RATIO=$(awk "BEGIN{printf \"%.1f\", ${ORIG_BYTES_INT}/${HEVC_BYTES}}")
            else
              COMP_RATIO="?"
            fi
            echo "HEVC_COMP_RATIO=$COMP_RATIO" >> $GITHUB_ENV
            echo "   Audio: ${HEVC_ACODEC} ${HEVC_ABR:-?}bps ${HEVC_ASR:-?}Hz ${HEVC_ACH:-?}ch | Ratio: ${COMP_RATIO}:1"
            # Metadata
            HDUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            HDUR_INT=${HDUR%.*}; [ -z "$HDUR_INT" ] && HDUR_INT=0
            echo "HEVC_DUR=$(printf '%02d:%02d:%02d' $((HDUR_INT/3600)) $(((HDUR_INT%3600)/60)) $((HDUR_INT%60)))" >> $GITHUB_ENV
            HW=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            HH=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            [ -n "$HW" ] && [ -n "$HH" ] && echo "HEVC_RES=${HW}x${HH}" >> $GITHUB_ENV
            HBR=$(ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            case "$HBR" in ''|*[!0-9]*) ;; *) echo "HEVC_VBITRATE=$(awk "BEGIN{printf \"%.1f Mbps\", ${HBR}/1000000}")" >> $GITHUB_ENV ;; esac
            # SHA256 hash for HEVC integrity
            HEVC_SHA256=$(sha256sum "$HEVC_FILE" | cut -d" " -f1)
            echo "HEVC_SHA256=$HEVC_SHA256" >> $GITHUB_ENV
            # Thumbnail HEVC
            HEVC_THUMB="${HEVC_FILE%.mp4}.jpg"
            HSEEK=1; [ "$HDUR_INT" -gt 6 ] && HSEEK=$((HDUR_INT / 2))
            ffmpeg -hide_banner -loglevel error -y -ss "$HSEEK" -i "$HEVC_FILE" \
              -frames:v 1 -q:v 2 -vf "scale=640:-2" "$HEVC_THUMB" 2>/dev/null || true
            [ -s "$HEVC_THUMB" ] && echo "HEVC_THUMB_FILE=$HEVC_THUMB" >> $GITHUB_ENV && echo "HAS_HEVC_THUMB=1" >> $GITHUB_ENV || echo "HAS_HEVC_THUMB=0" >> $GITHUB_ENV
          else
            echo "⚠️ HEVC encode gagal"
          fi

      # Step 10: Notify Telegram — HEVC
      - name: Notify Telegram — HEVC 10-bit
        if: always() && env.HEVC_FILE != ''
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ env.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          FILENAME: ${{ steps.record.outputs.output }}
          JOB_STATUS: success
          REAL_DURATION: ${{ env.REAL_DURATION }}
          RESOLUTION: ${{ env.RESOLUTION }}
          VCODEC: ${{ env.VCODEC }}
          VBITRATE: ${{ env.VBITRATE }}
          FILE_SIZE: ${{ env.FILE_SIZE }}
          THUMB_FILE: ${{ env.THUMB_FILE }}
          HAS_THUMB: ${{ env.HAS_THUMB }}
          HEVC_FILE: ${{ env.HEVC_FILE }}
          HEVC_SIZE: ${{ env.HEVC_SIZE }}
          HEVC_RES: ${{ env.HEVC_RES }}
          HEVC_VCODEC: hevc
          HEVC_VBITRATE: ${{ env.HEVC_VBITRATE }}
          HEVC_DUR: ${{ env.HEVC_DUR }}
          HEVC_THUMB_FILE: ${{ env.HEVC_THUMB_FILE }}
          HAS_HEVC_THUMB: ${{ env.HAS_HEVC_THUMB }}
          HEVC_LOUDNESS_I: ${{ env.HEVC_LOUDNESS_I }}
          HEVC_LOUDNESS_TP: ${{ env.HEVC_LOUDNESS_TP }}
          HEVC_LOUDNESS_LRA: ${{ env.HEVC_LOUDNESS_LRA }}
          HEVC_ACODEC: ${{ env.HEVC_ACODEC }}
          HEVC_ABR: ${{ env.HEVC_ABR }}
          HEVC_ASR: ${{ env.HEVC_ASR }}
          HEVC_ACH: ${{ env.HEVC_ACH }}
          HEVC_COMP_RATIO: ${{ env.HEVC_COMP_RATIO }}
          TG_API_URL: "http://localhost:8081"
          PHASE: hevc
        run: python3 scripts/notify.py

      # Step 11: Notify fallback (kalau Bot API Server gagal)
      - name: Notify Telegram — fallback text
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          RECORDED: ${{ steps.record.outputs.recorded }}
          HTTP: ${{ steps.verify.outputs.http_code }}
          OUTFILE: ${{ steps.record.outputs.output }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          # Skip kalau video sudah dikirim via notify.py
          if [ "$RECORDED" = "true" ]; then
            echo "Video sudah dikirim via notify.py — skip fallback"
            exit 0
          fi
          if [ "$HTTP" = "200" ]; then
            MSG="⚠️ Trans7 token OK tapi rekaman gagal"
          else
            MSG="❌ Trans7 failed — HTTP ${HTTP}"
          fi
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$MSG" || true
