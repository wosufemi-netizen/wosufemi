name: Record Trans7

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Recording duration in seconds"
        required: false
        default: "300"
      type:
        description: "Stream type (trans7/transtv/cnn)"
        required: false
        default: "trans7"
      chat_id:
        description: "Telegram chat ID"
        required: false
        default: ""
  repository_dispatch:
    types: [record-trans7]

env:
  STREAM_TYPE: ${{ github.event.inputs.type || github.event.client_payload.stream_type || 'trans7' }}
  DURATION: ${{ github.event.inputs.duration || github.event.client_payload.duration || '300' }}
  CHAT_ID: ${{ github.event.inputs.chat_id || github.event.client_payload.chat_id || '' }}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Jakarta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Step 1: Generate fresh token — pure Python, no browser
      - name: Generate Wowza token
        id: token
        run: |
          TOKEN_URL=$(python scripts/gen_trans7_token.py 2>&1 | grep '^TOKEN_URL=' | cut -d= -f2-)
          echo "url=$TOKEN_URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Token URL: ${TOKEN_URL:0:100}"

      # Step 2: Verify playlist reachable
      - name: Verify playlist
        id: verify
        run: |
          URL="${{ steps.token.outputs.url }}"
          echo "Testing: ${URL:0:80}..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Referer: https://20.detik.com/" \
            -H "Origin: https://20.detik.com" \
            "$URL")
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "::notice::Playlist HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Playlist returned $HTTP_CODE"
            exit 1
          fi

      # Step 3: Parse chunklist
      - name: Get chunklist URL
        id: chunklist
        if: steps.verify.outputs.http_code == '200'
        run: |
          URL="${{ steps.token.outputs.url }}"
          PLAYLIST=$(curl -s \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Referer: https://20.detik.com/" \
            "$URL")
          echo "$PLAYLIST"
          CHUNK=$(echo "$PLAYLIST" | grep -v '^#' | grep -v '^$' | head -1)
          if [ -z "$CHUNK" ]; then
            echo "::error::No chunklist found"
            exit 1
          fi
          if [[ "$CHUNK" != http* ]]; then
            BASE=$(echo "$URL" | sed 's|/[^/]*$||')
            CHUNK="${BASE}/${CHUNK}"
          fi
          echo "chunk_url=$CHUNK" >> "$GITHUB_OUTPUT"
          echo "::notice::Chunklist: ${CHUNK:0:100}"

      # Step 4: Record with ffmpeg
      - name: Record stream
        id: record
        if: steps.chunklist.outputs.chunk_url != ''
        run: |
          set +e
          URL="${{ steps.token.outputs.url }}"
          DUR="${{ env.DURATION }}"
          NOW=$(date '+%Y-%m-%d_%H-%M-%S')
          OUT="Trans7-${NOW}.mp4"

          echo "Recording ${DUR}s from Trans7..."
          ffmpeg -y \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -headers "Referer: https://20.detik.com/
          Origin: https://20.detik.com
          " \
            -i "$URL" \
            -t "$DUR" \
            -c copy \
            -movflags +faststart \
            "$OUT" 2>&1
          RC=$?

          if [ $RC -ne 0 ] || [ ! -f "$OUT" ]; then
            echo "::warn::Retrying with chunklist URL..."
            CHUNK="${{ steps.chunklist.outputs.chunk_url }}"
            ffmpeg -y \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -headers "Referer: https://20.detik.com/
          " \
              -i "$CHUNK" \
              -t "$DUR" \
              -c copy \
              -movflags +faststart \
              "$OUT" 2>&1
          fi

          if [ -f "$OUT" ]; then
            ls -lh "$OUT"
            echo "recorded=true" >> "$GITHUB_OUTPUT"
            echo "output=$OUT" >> "$GITHUB_OUTPUT"
            echo "ORIG_BYTES=$(stat -c%s "$OUT")" >> "$GITHUB_ENV"
            echo "FILE_SIZE=$(ls -lh "$OUT" | awk '{print $5}')" >> "$GITHUB_ENV"
          else
            echo "recorded=false" >> "$GITHUB_OUTPUT"
            echo "::error::No output file"
          fi

      # Step 5: Extract metadata + thumbnail
      - name: Extract metadata
        id: meta
        if: steps.record.outputs.recorded == 'true'
        run: |
          FILE="${{ steps.record.outputs.output }}"
          THUMB="${FILE%.mp4}.jpg"

          DUR_RAW=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null | head -1)
          DUR_INT=${DUR_RAW%.*}
          [ -z "$DUR_INT" ] && DUR_INT=0
          REAL_DURATION=$(printf '%02d:%02d:%02d' $((DUR_INT/3600)) $(((DUR_INT%3600)/60)) $((DUR_INT%60)))

          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width \
            -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null | head -1)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height \
            -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null | head -1)
          [ -n "$WIDTH" ] && [ -n "$HEIGHT" ] && RESOLUTION="${WIDTH}x${HEIGHT}" || RESOLUTION="?"

          VCODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null | head -1)
          [ -z "$VCODEC" ] && VCODEC="?"

          BR_RAW=$(ffprobe -v error -show_entries format=bit_rate \
            -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null | head -1)
          case "$BR_RAW" in ''|*[!0-9]*) VBITRATE="?" ;; *) VBITRATE="$(awk "BEGIN{printf \"%.1f Mbps\", ${BR_RAW}/1000000}")" ;; esac

          echo "📊 Metadata: dur=$REAL_DURATION res=$RESOLUTION codec=$VCODEC br=$VBITRATE size=${{ env.FILE_SIZE }}"

          # Thumbnail
          SEEK=1; [ "$DUR_INT" -gt 6 ] && SEEK=$((DUR_INT / 2))
          HAS_THUMB=0
          ffmpeg -hide_banner -loglevel error -y -ss "$SEEK" -i "$FILE" \
            -frames:v 1 -q:v 2 -vf "scale=640:-2" "$THUMB" 2>/dev/null || true
          [ ! -s "$THUMB" ] && ffmpeg -hide_banner -loglevel error -y -ss 1 -i "$FILE" \
            -frames:v 1 -q:v 2 -vf "scale=640:-2" "$THUMB" 2>/dev/null || true
          [ -s "$THUMB" ] && HAS_THUMB=1 && echo "✅ Thumbnail: $THUMB" || rm -f "$THUMB"

          {
            echo "REAL_DURATION=$REAL_DURATION"
            echo "RESOLUTION=$RESOLUTION"
            echo "VCODEC=$VCODEC"
            echo "VBITRATE=$VBITRATE"
            echo "THUMB_FILE=$THUMB"
            echo "HAS_THUMB=$HAS_THUMB"
          } >> $GITHUB_ENV

      # Step 6: Start local Bot API Server (allow >50MB uploads)
      - name: Start local Bot API Server
        if: success() && steps.record.outputs.recorded == 'true'
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set +e
          docker rm -f tg-bot-api >/dev/null 2>&1 || true
          rm -rf /tmp/tg-bot-api && mkdir -p /tmp/tg-bot-api
          docker run -d --name tg-bot-api -p 8081:8081 \
            -e TELEGRAM_API_ID="$TELEGRAM_API_ID" \
            -e TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
            -e TELEGRAM_LOCAL=1 \
            -v /tmp/tg-bot-api:/var/lib/telegram-bot-api \
            aiogram/telegram-bot-api:latest \
            --local -m 2097152000 --dir /var/lib/telegram-bot-api --http-port 8081 --verbosity=2
          echo "⏳ Menunggu Bot API Server siap..."
          for i in $(seq 1 45); do
            CODE=$(curl -s -o /tmp/getme.json -w "%{http_code}" "http://localhost:8081/bot${BOT_TOKEN}/getMe" 2>/dev/null)
            if [ "$CODE" = "200" ]; then echo "✅ Bot API Server ready"; break; fi
            sleep 2
          done

      # Step 7: Send video to Telegram
      - name: Notify Telegram — send video
        if: always() && steps.record.outputs.recorded == 'true'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ env.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          FILENAME: ${{ steps.record.outputs.output }}
          JOB_STATUS: success
          REAL_DURATION: ${{ env.REAL_DURATION }}
          RESOLUTION: ${{ env.RESOLUTION }}
          VCODEC: ${{ env.VCODEC }}
          VBITRATE: ${{ env.VBITRATE }}
          FILE_SIZE: ${{ env.FILE_SIZE }}
          ORIG_BYTES: ${{ env.ORIG_BYTES }}
          THUMB_FILE: ${{ env.THUMB_FILE }}
          HAS_THUMB: ${{ env.HAS_THUMB }}
          TG_API_URL: "http://localhost:8081"
          PHASE: original
        run: python3 scripts/notify.py

      # Step 8: Upload artifact (backup)
      - name: Upload recording
        if: steps.record.outputs.recorded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trans7-recording-${{ github.run_number }}
          path: Trans7-*.mp4
          retention-days: 3

      # Step 9: Encode HEVC 10-bit
      - name: Encode to HEVC 10-bit
        id: hevc
        if: always() && steps.record.outputs.recorded == 'true'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ env.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          FILENAME: ${{ steps.record.outputs.output }}
          DURATION_SEC: ${{ env.DURATION }}
          TG_API_URL: "http://localhost:8081"
        run: |
          FILE="${{ steps.record.outputs.output }}"
          HEVC_FILE="${FILE%.mp4}-h265-10bit.mp4"
          SRC_DUR_INT="${DURATION_SEC:-60}"
          [ "$SRC_DUR_INT" -le 0 ] && SRC_DUR_INT=60

          echo "🎞 Encoding HEVC 10-bit (main10, yuv420p10le, CRF 28)..."

          # Progress bar
          CHAT_ID="$CHAT_ID" FILENAME="$FILE" TG_API_URL="$TG_API_URL" \
            BOT_TOKEN="$BOT_TOKEN" PROGRESS_MSG_FILE=/tmp/trans7_hevc_progress \
            python3 scripts/progress.py start || true

          LAST_PCT=-1; NEXT_SEND=0
          ffmpeg -hide_banner -y -i "$FILE" \
            -c:v libx265 -profile:v main10 -pix_fmt yuv420p10le \
            -crf 28 -preset fast -tag:v hvc1 \
            -c:a copy \
            -progress pipe:1 \
            "$HEVC_FILE" 2>/dev/null | while IFS='=' read -r k v; do
            if [ "$k" = "out_time_ms" ]; then
              ms=${v%.*}
              [ "$ms" -gt 0 ] 2>/dev/null || continue
              cur=$(( ms / 1000000 ))
              pct=$(( (cur * 100) / SRC_DUR_INT ))
              [ "$pct" -gt 100 ] && pct=100
              now=$(date +%s)
              if [ "$pct" -ge "$((LAST_PCT + 10))" ] && [ "$now" -ge "$NEXT_SEND" ]; then
                LAST_PCT=$(( (pct / 10) * 10 ))
                NEXT_SEND=$(( now + 5 ))
                echo "🔄 HEVC encode ${LAST_PCT}%"
                CHAT_ID="$CHAT_ID" FILENAME="$FILE" TG_API_URL="$TG_API_URL" \
                  BOT_TOKEN="$BOT_TOKEN" PROGRESS_MSG_FILE=/tmp/trans7_hevc_progress \
                  python3 scripts/progress.py progress "$LAST_PCT" || true
              fi
            fi
          done

          CHAT_ID="$CHAT_ID" FILENAME="$FILE" TG_API_URL="$TG_API_URL" \
            BOT_TOKEN="$BOT_TOKEN" PROGRESS_MSG_FILE=/tmp/trans7_hevc_progress \
            python3 scripts/progress.py done || true

          if [ -s "$HEVC_FILE" ]; then
            HEVC_SIZE=$(ls -lh "$HEVC_FILE" | awk '{print $5}')
            echo "✅ HEVC 10-bit: $HEVC_SIZE"
            echo "HEVC_FILE=$HEVC_FILE" >> $GITHUB_ENV
            echo "HEVC_SIZE=$HEVC_SIZE" >> $GITHUB_ENV
            # Metadata
            HDUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            HDUR_INT=${HDUR%.*}; [ -z "$HDUR_INT" ] && HDUR_INT=0
            echo "HEVC_DUR=$(printf '%02d:%02d:%02d' $((HDUR_INT/3600)) $(((HDUR_INT%3600)/60)) $((HDUR_INT%60)))" >> $GITHUB_ENV
            HW=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            HH=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            [ -n "$HW" ] && [ -n "$HH" ] && echo "HEVC_RES=${HW}x${HH}" >> $GITHUB_ENV
            HBR=$(ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$HEVC_FILE" 2>/dev/null | head -1)
            case "$HBR" in ''|*[!0-9]*) ;; *) echo "HEVC_VBITRATE=$(awk "BEGIN{printf \"%.1f Mbps\", ${HBR}/1000000}")" >> $GITHUB_ENV ;; esac
            # Thumbnail HEVC
            HEVC_THUMB="${HEVC_FILE%.mp4}.jpg"
            HSEEK=1; [ "$HDUR_INT" -gt 6 ] && HSEEK=$((HDUR_INT / 2))
            ffmpeg -hide_banner -loglevel error -y -ss "$HSEEK" -i "$HEVC_FILE" \
              -frames:v 1 -q:v 2 -vf "scale=640:-2" "$HEVC_THUMB" 2>/dev/null || true
            [ -s "$HEVC_THUMB" ] && echo "HEVC_THUMB_FILE=$HEVC_THUMB" >> $GITHUB_ENV && echo "HAS_HEVC_THUMB=1" >> $GITHUB_ENV || echo "HAS_HEVC_THUMB=0" >> $GITHUB_ENV
          else
            echo "⚠️ HEVC encode gagal"
          fi

      # Step 10: Notify Telegram — HEVC
      - name: Notify Telegram — HEVC 10-bit
        if: always() && env.HEVC_FILE != ''
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ env.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          FILENAME: ${{ steps.record.outputs.output }}
          JOB_STATUS: success
          REAL_DURATION: ${{ env.REAL_DURATION }}
          RESOLUTION: ${{ env.RESOLUTION }}
          VCODEC: ${{ env.VCODEC }}
          VBITRATE: ${{ env.VBITRATE }}
          FILE_SIZE: ${{ env.FILE_SIZE }}
          THUMB_FILE: ${{ env.THUMB_FILE }}
          HAS_THUMB: ${{ env.HAS_THUMB }}
          HEVC_FILE: ${{ env.HEVC_FILE }}
          HEVC_SIZE: ${{ env.HEVC_SIZE }}
          HEVC_RES: ${{ env.HEVC_RES }}
          HEVC_VCODEC: hevc
          HEVC_VBITRATE: ${{ env.HEVC_VBITRATE }}
          HEVC_DUR: ${{ env.HEVC_DUR }}
          HEVC_THUMB_FILE: ${{ env.HEVC_THUMB_FILE }}
          HAS_HEVC_THUMB: ${{ env.HAS_HEVC_THUMB }}
          TG_API_URL: "http://localhost:8081"
          PHASE: hevc
        run: python3 scripts/notify.py

      # Step 11: Notify fallback (kalau Bot API Server gagal)
      - name: Notify Telegram — fallback text
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          RECORDED: ${{ steps.record.outputs.recorded }}
          HTTP: ${{ steps.verify.outputs.http_code }}
          OUTFILE: ${{ steps.record.outputs.output }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          # Skip kalau video sudah dikirim via notify.py
          if [ "$RECORDED" = "true" ]; then
            echo "Video sudah dikirim via notify.py — skip fallback"
            exit 0
          fi
          if [ "$HTTP" = "200" ]; then
            MSG="⚠️ Trans7 token OK tapi rekaman gagal"
          else
            MSG="❌ Trans7 failed — HTTP ${HTTP}"
          fi
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$MSG" || true
